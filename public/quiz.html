<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light only">
<title>The Hidden Operating System — Personality Quiz</title>
<style>
  html, body {
    overflow-x: hidden;
    max-width: 100%;
    color-scheme: light only;
    background: #faf8f5;
  }
  .bg-watermark {
    display: block;
    width: 300px;
    max-width: 68vw;
    margin: 20px auto 0;
    opacity: 1;
    pointer-events: none;
  }
  body {
    background: #faf8f5;
    font-family: Georgia, 'Times New Roman', serif;
    color: #2b2b2b;
    max-width: 680px;
    margin: 0 auto 40px;
    padding: 0 20px;
    line-height: 1.55;
  }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
  }
  @media (max-width: 480px) {
    body {
      margin: 0 auto 0;
      padding: 0 12px;
    }
    .card {
      padding: 18px 16px;
      border-radius: 0;
      border-left-width: 0;
      border-right-width: 0;
      box-shadow: none;
    }
    h1 {
      font-size: 1.25em;
      text-align: center;
      padding: 16px 0 8px 0;
    }
    .headliner {
      margin: -18px -16px 16px -16px;
    }
    .headliner-title { font-size: 1.5em; }
    .cta-box a.primary, .cta-box button.primary {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-right: 0 !important;
    }
    .audit-card { padding: 16px 14px; }
    table.report-table { font-size: 0.78em; }
  }
  h1 { font-size: 1.6em; }
  h2 { margin-top: 0; }
  h3 { margin-bottom: 4px; font-size: 1.05em; }
  h4 { margin-bottom: 4px; font-size: 0.95em; }
  .card {
    background: transparent;
    border: none;
    border-radius: 10px;
    padding: 28px;
    box-shadow: none;
  }
  button.choice {
    display: block;
    width: 100%;
    box-sizing: border-box;
    min-height: 44px;
    text-align: left;
    margin: 10px 0;
    padding: 14px 16px;
    font-size: 1em;
    font-family: inherit;
    background: #f2efe9;
    border: 1px solid #ccc;
    border-radius: 8px;
    cursor: pointer;
  }
  button.choice:hover { background: #e9e4da; }
  button.primary, a.primary {
    box-sizing: border-box;
    min-height: 44px;
    margin-top: 20px;
    padding: 12px 22px;
    font-size: 1em;
    font-family: inherit;
    background: linear-gradient(135deg, #8a6a17, #ab5518);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(138,106,23,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button.primary:hover, a.primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 14px rgba(138,106,23,0.45);
    color: #fff;
  }
  .top-accent-bar {
    height: 6px;
    border-radius: 6px;
    margin: 0 0 20px 0;
    background: linear-gradient(90deg, #c9a227, #3b6ea5, #d1691e, #4c7a4c);
  }
  input[type="email"], input[type="text"], select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .scorebar { font-size: 0.9em; color: #666; margin-top: 24px; }
  .result-gold { border-left: 6px solid #c9a227; }
  .result-blue { border-left: 6px solid #3b6ea5; }
  .result-orange { border-left: 6px solid #d1691e; }
  .result-green { border-left: 6px solid #4c7a4c; }
  ul.tips { padding-left: 20px; }
  ul.tips li { margin-bottom: 6px; }
  ul.audits { padding-left: 20px; }
  ul.audits li { margin-bottom: 4px; }
  .error { color: #a33; font-size: 0.9em; margin-top: -6px; margin-bottom: 12px; }
  .primary-audit-box {
    background: #f7f4ec;
    border: 1px solid #e0dacb;
    border-radius: 8px;
    padding: 16px 18px;
    margin-top: 14px;
  }
  .wiring-line {
    font-style: italic;
    color: #555;
    margin-bottom: 14px;
  }
  .wiring-preview {
    background: rgba(255,255,255,0.72);
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 14px 18px;
    margin: 16px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .wiring-preview div {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
  }
  .wiring-preview div:last-child { border-bottom: none; }
  .wiring-preview em { color: #666; }
  .audit-card {
    background: #232b36;
    color: #d7dee6;
    border-radius: 10px;
    padding: 24px 22px;
    margin: 20px 0;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .audit-card h4 {
    color: #eef2f6;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 0.9em;
    margin-bottom: 6px;
    border-bottom: 1px solid #3c4552;
    padding-bottom: 6px;
  }
  .audit-card .hidden-q {
    font-style: italic;
    color: #9fb0c3;
    margin-top: 6px;
  }
  .audit-card .badge {
    display: inline-block;
    border: 1px solid #556271;
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 0.85em;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }
  .audit-card section { margin-bottom: 16px; }
  .audit-card .own-style {
    border: 1px solid #3c4552;
    border-radius: 8px;
    padding: 12px 14px;
    font-style: italic;
    margin-top: 4px;
  }
  .potted-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin: 16px 0;
  }
  @media (min-width: 520px) {
    .potted-grid { grid-template-columns: repeat(4, 1fr); }
  }
  .potted-item {
    text-align: center;
    padding: 10px 6px;
  }
  .potted-item .verb {
    font-weight: bold;
    letter-spacing: 1px;
    font-size: 0.95em;
    margin-bottom: 4px;
  }
  .potted-item .desc {
    font-size: 0.82em;
    color: #666;
    font-style: italic;
  }
  .card-sort-item {
    border: 1px solid #ddd;
    border-left-width: 6px;
    border-radius: 8px;
    padding: 14px 16px;
    background: #fff;
  }
  .card-sort-item.card-sort-primary {
    background: #fdfaf2;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .card-sort-rank {
    font-size: 0.78em;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #888;
    font-weight: bold;
  }
  .cta-box {
    background: #eef2f5;
    border: 1px solid #d5dee4;
    border-radius: 10px;
    padding: 20px 22px;
    margin: 20px 0;
    text-align: center;
  }
  button.secondary-btn {
    background: #fff;
    color: #2b2b2b;
    border: 1px solid #2b2b2b;
  }
  @media print {
    .no-print { display: none !important; }
    .bg-watermark { display: none !important; }
    body { background: #fff; margin: 0; }
    .card { box-shadow: none; border: none; }
  }
  hr.section-break {
    border: none;
    border-top: 1px solid #eee;
    margin: 22px 0;
  }
  .headliner {
    text-align: center;
    padding: 20px 10px 24px 10px;
    margin: -28px -28px 20px -28px;
    border-radius: 10px 10px 0 0;
    background: #2b2b2b;
    color: #fff;
  }
  .headliner-name {
    font-size: 0.85em;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #bbb;
  }
  .headliner-color {
    font-size: 0.8em;
    letter-spacing: 3px;
    margin-top: 6px;
    opacity: 0.75;
  }
  .headliner-title {
    font-size: 2em;
    font-weight: bold;
    margin-top: 4px;
  }
  .result-gold .headliner { background: #c9a227; }
  .result-blue .headliner { background: #3b6ea5; }
  .result-orange .headliner { background: #d1691e; }
  .result-green .headliner { background: #4c7a4c; }
  .report-header {
    text-align: center;
    border-bottom: 3px double #2b2b2b;
    padding-bottom: 14px;
    margin-bottom: 20px;
  }
  .report-header .kicker {
    letter-spacing: 2px;
    font-size: 0.75em;
    text-transform: uppercase;
    color: #888;
  }
  .report-header h2 {
    font-size: 1.5em;
    margin: 4px 0 2px 0;
  }
  .report-header .formerly {
    font-style: italic;
    color: #777;
    font-size: 0.9em;
  }
  .section-number {
    display: inline-block;
    background: #2b2b2b;
    color: #fff;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    text-align: center;
    line-height: 22px;
    font-size: 0.8em;
    margin-right: 8px;
  }
  .field-label {
    font-weight: bold;
  }
  .field-block { margin-bottom: 12px; }
  table.report-table {
    width: 100%;
    max-width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    margin: 12px 0 20px 0;
    font-size: 0.85em;
  }
  table.report-table th, table.report-table td {
    border: 1px solid #ddd;
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
    word-wrap: break-word;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  table.report-table th {
    background: #f2efe9;
  }
  .table-scroll {
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
</style>
</head>

const HUBSPOT_FORM_GUID = "PASTE_LEAD_FORM_GUID_HERE";

const QUIZ_PUBLIC_URL = "https://xcel.team/quiz";

// True for any config value that hasn't been filled in yet.
function unset(v) {
  return !v || v.indexOf("PASTE_") !== -1;
}

// Base address for result links. Falls back to the live page.
function quizBase() {
  if (!unset(QUIZ_PUBLIC_URL)) return QUIZ_PUBLIC_URL.replace(/\/+$/, "");
  return window.location.origin + window.location.pathname;
}

// Deep link that opens straight onto a given archetype's report.
function resultLink(color, name) {
  let url = `${quizBase()}?r=${encodeURIComponent(color)}`;
  if (name) url += `&n=${encodeURIComponent(name)}`;
  return url;
}

const HUBSPOT_RESULT_PROPERTY = "hos_quiz_result";

// HubSpot's tracking cookie, so the submission ties to the
// visitor's existing analytics session when one exists.
function getHutk() {
  const m = document.cookie.match(/hubspotutk=([^;]*)/);
  return m ? m[1] : null;
}

/* Submits to the HubSpot Forms API. Safe to call from the browser:
   this endpoint is public by design and carries no API key.
   HubSpot dedupes on email, so the second call (with the quiz
   result) updates the same contact rather than making a new one. */
async function submitToHubSpot(fields, label, formGuid) {
  // Fall back to the lead form if an archetype form isn't set up yet.
  let guid = formGuid && formGuid.indexOf("PASTE_") === -1
    ? formGuid
    : HUBSPOT_FORM_GUID;

  if (!guid || guid.indexOf("PASTE_") !== -1) {
    console.log(`TEST MODE (${label}) — no HubSpot form GUID set. Would send:`, fields);
    return { ok: false, testMode: true };
  }

  const payload = {
    fields: Object.keys(fields)
      .filter(k => fields[k] !== "" && fields[k] != null)
      .map(k => ({ objectTypeId: "0-1", name: k, value: fields[k] })),
    context: {
      pageUri: window.location.href,
      pageName: document.title
    }
  };

  const hutk = getHutk();
  if (hutk) payload.context.hutk = hutk;

  const url = `https://api.hsforms.com/submissions/v3/integration/submit/${HUBSPOT_PORTAL_ID}/${guid}`;

  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const detail = await res.text();
      console.error(`HubSpot ${label} failed (${res.status}):`, detail);
      return { ok: false, status: res.status };
    }
    console.log(`HubSpot ${label} submitted.`);
    return { ok: true };
  } catch (err) {
    // Never block the quiz on a capture failure.
    console.error(`HubSpot ${label} error:`, err);
    return { ok: false, error: String(err) };
  }
}

/* ============================================================
   SHAREABLE RESULT LINKS
   ------------------------------------------------------------
   Lets an email link straight to someone's finished report:
       yourpage.html?r=blue&n=Matthew
   This is what makes the assessment emailable — HubSpot sends
   the link, the page rebuilds the full report on arrival.
   Arriving this way skips the email gate and the questions,
   and does NOT re-submit anything to HubSpot.
   ============================================================ */
(function readResultLink() {
  try {
    const params = new URLSearchParams(window.location.search);
    const r = (params.get("r") || "").toLowerCase().trim();
    const n = (params.get("n") || "").trim();
    if (["gold", "blue", "orange", "green"].includes(r)) {
      forcedResult = r;
      // Strip tags defensively; this value comes from a URL.
      userName = n.replace(/[<>]/g, "").slice(0, 60);
      stage = "results";
    }
  } catch (err) {
    console.error("Could not read result link:", err);
  }
})();
/* ============================================================
   SCORING

   Column total = sum of that archetype's five rank values, so it runs
   5 to 20 and the four always sum to 50. Highest column wins.

   No standardising needed. Forced ranking is already ipsative: it
   measures each archetype against the other three inside one person
   rather than against a population, which is exactly the question a
   type sorter asks and the reason this format resists the trained
   habits that skewed the rate-each-statement version.
   ============================================================ */

function columnTotals() {
  const out = { gold: 0, blue: 0, orange: 0, green: 0 };
  ranks.forEach(row => {
    if (!row) return;
    COLORS.forEach(c => { out[c] += (row[c] || 0); });
  });
  return out;
}

/* Tie-break. Colour order must never decide this: that is the bug that
   pushed a quarter of all results to The Stabilizer in an earlier
   build. A tie here is a real tie, since every row is a clean 1-2-3-4,
   so it falls to a hash of the person's own rankings. That comes out
   even across the four archetypes and is stable across reloads, so a
   shared result link always shows the same thing. The blend line below
   tells the reader it was close. */
function breakTie(tied) {
  if (tied.length === 1) return tied[0];

  /* The hash needs real bit mixing, not a running total. A plain
     h = h*31 + rank reduces mod 2 to the sum of all the ranks, and
     every row is a 1+2+3+4, so that sum is ALWAYS 50 and h was always
     even. With two archetypes tied it picked tied[0] every single
     time, which is colour order wearing a disguise. FNV-1a over
     (rank, row, column) plus a murmur3 finalizer gives low bits that
     actually vary. */
  let h = 2166136261 >>> 0;
  ranks.forEach((row, ri) => {
    if (!row) return;
    COLORS.forEach((c, ci) => {
      h = (h ^ ((row[c] || 0) + ri * 7 + ci * 13)) >>> 0;
      h = Math.imul(h, 16777619) >>> 0;
    });
  });
  h = (h ^ (h >>> 16)) >>> 0;
  h = Math.imul(h, 2246822507) >>> 0;
  h = (h ^ (h >>> 13)) >>> 0;
  h = Math.imul(h, 3266489909) >>> 0;
  h = (h ^ (h >>> 16)) >>> 0;

  return tied[h % tied.length];
}

function render() {

  if (stage === "email") {
    app.className = 'card';
    app.innerHTML = `

      <h2>Everyone is running on an operating system they never chose and rarely question.</h2>

      </div>
      <p>You already are one of these. The question is whether you're using it on purpose.</p>
      <input type="text" id="nameInput" placeholder="First name" />
      <input type="email" id="emailInput" placeholder="Email address" />
      <div class="error" id="formError" style="display:none;"></div>
      <button class="primary" id="submitEmailBtn">Get My Free Report</button>
    `;
    document.getElementById('submitEmailBtn').onclick = async () => {
      const name = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const errorBox = document.getElementById('formError');
      const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

      if (!validEmail) {
        errorBox.textContent = "Please enter a valid email address.";
        errorBox.style.display = "block";
        return;
      }

      userName = name;
      userEmail = email;

      // Capture the lead now, before the quiz, so a drop-off
      // still lands in the CRM.
      submitToHubSpot({ firstname: userName, email: userEmail }, "lead");

      // Optional secondary endpoint (Zapier, etc.) if you ever want one.
      if (LEAD_ENDPOINT && LEAD_ENDPOINT.indexOf("PASTE_") === -1) {
        try {
          await fetch(LEAD_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: userName, email: userEmail })
          });
        } catch (err) {
          console.error("Secondary lead capture failed:", err);
        }
      }

      stage = "intro";
      render();
    };
    return;
  }

  if (stage === "intro") {
    app.className = 'card';
    app.innerHTML = `
      <h2>Ready, ${userName || "friend"}?</h2>
      <p>Five sets of four word pairs. In each set you'll put them in order, from most like you to least.</p>
      <p>You have to choose. That's deliberate. Rating each one on its own lets you agree with everything and tells us nothing, so this makes the traits compete and your real priorities show up in what you rank last.</p>
      <p>Go on instinct. Describe who you actually are now, not who you're working on becoming.</p>
      <p style="font-size:0.85em; color:#888;">Takes about 90 seconds.</p>
      <button class="primary" id="beginBtn">Begin</button>
    `;
    document.getElementById('beginBtn').onclick = () => { stage = "quiz"; current = 0; render(); };
    return;
  }

  if (stage === "quiz") {
    const row = ROWS[current];
    const pct = Math.round((current / ROWS.length) * 100);
    const remaining = COLORS.filter(c => !rowPicks.includes(c));
    const nextRank = COLORS.length - rowPicks.length;   // 4, then 3, 2, 1
    const ordinal = ["most", "second most", "third most", "least"][rowPicks.length];

    let html = `
      <div style="font-size:0.8em; color:#888; margin-bottom:4px;">Set ${current + 1} of ${ROWS.length}</div>
      <div style="background:#eee; border-radius:6px; height:6px; margin-bottom:18px; overflow:hidden;">
        <div style="background:#2b2b2b; height:100%; width:${pct}%;"></div>
      </div>
      <h2 style="margin-top:0;">Which is <em>${ordinal}</em> like you?</h2>
      <div style="font-size:0.85em; color:#888; margin-bottom:12px;">Pick them in order. There's no right answer, only what fits.</div>`;

    remaining.forEach(c => {
      html += `<button class="choice" data-color="${c}">${row[c].join(" &middot; ")}</button>`;
    });

    if (rowPicks.length) {
      html += `<div style="margin-top:16px; font-size:0.85em; color:#888;">Ranked so far: `
            + rowPicks.map((c, i) => `${4 - i}. ${row[c].join(" &middot; ")}`).join(" &nbsp;|&nbsp; ")
            + `</div>`;
    }
    html += `<button class="primary secondary-btn no-print" id="backBtn" style="margin-top:14px;">Back</button>`;

    app.innerHTML = html;

    app.querySelectorAll('.choice').forEach(btn => {
      btn.onclick = () => {
        const c = btn.dataset.color;
        if (!ranks[current]) ranks[current] = {};
        ranks[current][c] = nextRank;
        rowPicks.push(c);
        if (rowPicks.length === COLORS.length) {
          rowPicks = [];
          current++;
          if (current >= ROWS.length) stage = "results";
        }
        render();
      };
    });

    document.getElementById('backBtn').onclick = () => {
      if (rowPicks.length) {
        // undo the last pick inside this row
        const last = rowPicks.pop();
        if (ranks[current]) delete ranks[current][last];
      } else if (current > 0) {
        current--;
        ranks[current] = {};
      }
      render();
    };
    return;

        render();

          <p style="margin-top:6px;">You'll likely understand each other's instincts fast \u2014 the risk is you both share the same blind spot too. ${mine.commStress}</p>
        </div>
      ` : `
        <div class="field-block">
          <span class="field-label">When You're ${mine.title} and They're ${theirs.title}:</span>
          <p style="margin-top:6px;">${mine.talkingTo[compareSelection] || ''}</p>
        </div>
        <div class="field-block">
          <span class="field-label">When They're ${theirs.title} and You're ${mine.title}:</span>
          <p style="margin-top:6px;">${theirs.talkingTo[myResultColor] || ''}</p>
        </div>
      `}

      <div class="field-block">
        <span class="field-label">Where You'll Likely Clash:</span>
        <p style="margin-top:6px;">You, under stress: ${mine.commStress}<br>They, under stress: ${theirs.commStress}</p>
      </div>

      <div class="field-block">
        <span class="field-label">Where You'll Cover for Each Other:</span>
        <p style="margin-top:6px;">You bring: ${mine.ownYourStyle}<br>They bring: ${theirs.ownYourStyle}</p>
      </div>

      <button class="primary" id="compareAgainBtn">Compare a Different Result</button>
      <button class="primary secondary-btn" id="backToResultsBtn2" style="margin-left:8px;">Back to My Result</button>
    `;
    document.getElementById('compareAgainBtn').onclick = () => {
      compareSelection = null;
      render();
    };
    document.getElementById('backToResultsBtn2').onclick = () => {
      stage = "results";
      render();
    };
    return;
  }

  /* stage === "results"
     Highest score wins. On a tie, the old code always handed the win
     to gold, which biased roughly a quarter of all results toward The
     Stabilizer. Ties now go to whichever tied leader the respondent
     chose most recently, which is their own latest self-report rather
     than an artifact of the color order. Still deterministic, so a
     reload or a shared link shows the same archetype. */
  const colorOrder = COLORS;
  const totals = columnTotals();
  colorOrder.forEach(c => { scores[c] = totals[c]; });

  const topScore = Math.max(...colorOrder.map(c => scores[c]));
  const tiedLeaders = colorOrder.filter(c => scores[c] === topScore);
  let top = breakTie(tiedLeaders);

  if (forcedResult) top = forcedResult;   // arrived via a result link
  myResultColor = top;
  const r = results[top];
  const archetypeLabels = { gold: 'The Stabilizer', blue: 'The Relationist', orange: 'The Activator', green: 'The Architect' };

  // Update the contact with the archetype they landed on.
  // Same email, so HubSpot updates the existing record.
  if (!resultSent && userEmail) {
    resultSent = true;
    const payload = { firstname: userName, email: userEmail };
    if (HUBSPOT_RESULT_PROPERTY) {
      payload[HUBSPOT_RESULT_PROPERTY] = archetypeLabels[top];
    }
    // Submitting to the archetype's own form is what triggers
    // that archetype's follow-up email.
    submitToHubSpot(payload, `quiz result (${top})`, HUBSPOT_RESULT_FORMS[top]);
  }

  let tipsHtml = '';
  ['gold', 'blue', 'orange', 'green'].filter(c => c !== top).forEach(c => {
    tipsHtml += `<li><strong>Talking to ${archetypeLabels[c]}:</strong> ${r.talkingTo[c]}</li>`;
  });

  let auditsHtml = '';
  r.audits.forEach(a => { auditsHtml += `<li>${a}</li>`; });

  const sortedRanking = ['gold', 'blue', 'orange', 'green']
    .map(key => ({ key, data: results[key] }))
    .sort((a, b) => scores[b.key] - scores[a.key]);

  const secondPlace = sortedRanking[1];
  /* Two points apart is a single rank swap in a single row, which is
     well inside the noise of a five-row sort. Call that a blend. */
  const isBlend = secondPlace && (scores[top] - scores[secondPlace.key]) <= 2;
  const blendLine = isBlend
    ? `${results[top].title} with a strong ${secondPlace.data.title.replace(/^The /, '')} undertone`
    : '';

  let auditsWithParensHtml = '';
  r.auditsWithParens.forEach(a => {
    const m = a.match(/Tool #(\d+)/);
    const num = m ? m[1] : null;
    const useWhen = (num && USE_WHEN[num])
      ? `<br><span style="color:#888; font-size:0.85em;">USE WHEN: ${USE_WHEN[num]}</span>`
      : '';
    auditsWithParensHtml += `<li>${a}${useWhen}</li>`;
  });

  const comparisonRows = [
    { key: 'gold', color: 'Gold', archetype: 'The Stabilizer', wiring: 'Wired for predictability, clear roles, and predictable rhythms.', audits: 'Tool #9 (Vibe Check) Tool #12 (Resilience)' },
    { key: 'blue', color: 'Blue', archetype: 'The Relationist', wiring: 'Focused on psychological safety, \u201cAbove the Line\u201d alignment, and trust.', audits: 'Tool #2 (Story) Tool #7 (Conversation)' },
    { key: 'orange', color: 'Orange', archetype: 'The Activator', wiring: 'Thrives on momentum, fast moves, and adaptability.', audits: 'Tool #1 (Energy) Tool #3 (Resistance)' },
    { key: 'green', color: 'Green', archetype: 'The Architect', wiring: 'Methodical, analytical, stress-tests ideas, seeks the \u201cwhy.\u201d', audits: 'Tool #5 (Lens) Tool #10 (Exposure)' }
  ];
  let comparisonRowsHtml = '';
  comparisonRows.forEach(row => {
    const highlight = row.key === top ? ' style="background:#f7f4ec; font-weight:bold;"' : '';
    comparisonRowsHtml += `<tr${highlight}><td>${row.color}</td><td>${row.archetype}</td><td>${row.wiring}</td><td>${row.audits}</td></tr>`;
  });

  app.className = 'card result-' + top;
  app.innerHTML = `
    <div class="headliner">
      <div class="headliner-name">${userName ? userName + "'s Result" : "Your Result"}</div>
      <div class="headliner-color">${top.toUpperCase()}</div>
      <div class="headliner-title">${r.title}</div>
      ${isBlend ? `<div style="font-size:0.9em; opacity:0.85; margin-top:6px;">${blendLine}</div>` : ''}
    </div>

    <div class="report-header">
      <div class="kicker">Personality Quiz &amp; Cast Alignment</div>
      <h2>THE HIDDEN OPERATING SYSTEM</h2>
      <div class="formerly">Cast evaluation, book alignment, and quiz-result funnel</div>
    </div>

    <h3>Executive Summary</h3>
    <p>Every team and every relationship runs on patterns most people never name out loud \u2014 until something breaks. The Hidden Operating System's 12 Pocket Audits exist to catch those patterns early: in energy, in communication, in trust, in change. This report starts by identifying ${userName ? userName + "'s" : "your"} core wiring on the four-personality color cast, then points directly to the audit tools built for exactly that wiring, so the insight turns into something ${userName ? userName : "you"} can actually use.</p>

    <hr class="section-break">
    <h3>1. Personality Cast Evaluation</h3>
    <p><strong>${top.charAt(0).toUpperCase()+top.slice(1)}: ${r.title}</strong> <em>(Formerly: ${r.formerly})</em></p>
    <div class="field-block"><span class="field-label">Original Description:</span> ${r.originalDescription}</div>
    <div class="field-block"><span class="field-label">Book Alignment:</span> ${r.bookAlignment}</div>
    <div class="field-block">
      <span class="field-label">Primary Book Audits:</span>
      <ul class="audits">${auditsWithParensHtml}</ul>
    </div>

    <div class="field-block" style="margin-top:18px;">
      <span class="field-label">How This Shows Up in Communication &amp; Business:</span>
      <p style="margin-top:6px;">${r.work}</p>
      <p>${r.workingWithOthers}</p>
    </div>
    <div class="field-block">
      <span class="field-label">How This Shows Up in Dating:</span>
      <p style="margin-top:6px;">${r.dating}</p>
    </div>
    <div class="field-block">
      <span class="field-label">How This Shows Up in Marriage:</span>
      <p style="margin-top:6px;">${r.marriage}</p>
    </div>
    <div class="field-block">
      <span class="field-label">How This Shows Up in Parenting:</span>
      <p style="margin-top:6px;">${r.parenting}</p>
    </div>
    <div class="field-block">
      <span class="field-label">Your Leadership Style:</span>
      <p style="margin-top:6px;"><strong>${r.leadershipLabel}</strong></p>
      <p>${r.leadership}</p>
    </div>

    <hr class="section-break">
    <div class="audit-card">
      <div class="badge">THE HIDDEN OPERATING SYSTEM &middot; AUDIT TOOLS</div>
      <div style="font-size:0.8em; color:#8a97a6; margin-bottom:14px;">By Matthew and Dan Cox</div>
      <h4 style="border:none; font-size:1.1em; color:#fff;">${top.toUpperCase()} &mdash; ${r.title.toUpperCase()}</h4>

      <section>
        <h4>Core Personality</h4>
        <p>${r.corePersonalityLines}</p>
        <p class="hidden-q">Hidden question: ${r.hiddenQuestion}</p>
      </section>

      <section>
        <h4>Communication Dynamics</h4>
        <p><strong>Normal:</strong> ${r.commNormal}</p>
        <p><strong>Under stress:</strong> ${r.commStress}</p>
      </section>

      <section>
        <h4>Relational Contexts</h4>
        <p><strong>Workplace:</strong> ${r.ctxWorkplace}<br>
        <strong>Family:</strong> ${r.ctxFamily}<br>
        <strong>Friendship:</strong> ${r.ctxFriendship}<br>
        <strong>Community:</strong> ${r.ctxCommunity}</p>
      </section>

      <div class="own-style"><strong>Own Your Style:</strong><br>${r.ownYourStyle}</div>
    </div>

    <h3 style="text-align:center;">Your Card Sort — Ranked by Score</h3>
    <p style="text-align:center; font-style:italic; color:#666;">Every card, lined up first to last based on how you actually answered.</p>
    ${sortedRanking.map((row, i) => `
      <div class="card-sort-item ${row.key === top ? 'card-sort-primary' : ''} result-${row.key}" style="margin-top:${i === 0 ? '10' : '18'}px;">
        <div class="card-sort-rank">#${i + 1}${row.key === top ? ' \u2014 YOUR RESULT' : ''}</div>
        <h4 style="margin:2px 0 0 0;">${row.key.toUpperCase()} \u2014 ${row.data.title.toUpperCase()}</h4>
        <p style="font-style:italic; color:#666; margin:2px 0 10px 0;">${row.data.hiddenQuestion}</p>
        <div class="potted-grid">
          ${row.data.pottedTools.map(t => `
            <div class="potted-item">
              <div class="verb">${t.verb}</div>
              <div class="desc">${t.desc}</div>
            </div>
          `).join('')}
        </div>
        <div style="font-size:0.85em; color:#888; margin-top:8px;">Score: ${scores[row.key]}</div>
      </div>
    `).join('')}

    <hr class="section-break">
    <h3>2. Comparison Table: Book Alignment &amp; Terminology</h3>
    <div class="table-scroll">
      <table class="report-table">
        <tr><th>Color</th><th>Archetype</th><th>Core Concept &amp; Wiring</th><th>Linked Audits</th></tr>
        ${comparisonRowsHtml}
      </table>
    </div>

    <hr class="section-break">
    <p><strong>${top.charAt(0).toUpperCase()+top.slice(1)} Result:</strong> ${r.primaryAuditSentence}</p>

    <hr class="section-break no-print">
    <div class="cta-box no-print">
      <h3 style="margin-top:0;">Next Steps</h3>
      <p>Want help putting this to work on your actual team or relationship?</p>
      ${unset(BOOKING_URL) ? '' : `<a class="primary" id="bookCallBtn" href="${BOOKING_URL}" target="_blank" rel="noopener" style="display:inline-block; text-decoration:none; margin-right:10px; margin-bottom:10px;">Book a Free Audit Call</a>`}
      <button class="primary secondary-btn" id="downloadPdfBtn" style="margin-bottom:10px;">Download Full Report (PDF)</button>
      <br>
      <button class="primary secondary-btn" id="compareBtn">Compare With Someone Else</button>
      <button class="primary secondary-btn" id="shareBtn" style="margin-left:10px;">Copy Link To My Result</button>
    </div>

    <hr class="section-break">
    <p style="text-align:center; color:#888; font-size:0.85em;">The Hidden Operating System &bull; Personality Quiz &amp; Cast Alignment</p>

    ${forcedResult ? '' : `<div class="scorebar">
      Stabilizer ${scores.gold} · Relationist ${scores.blue} · Activator ${scores.orange} · Architect ${scores.green}
      <div style="margin-top:4px;">Each out of 20, always totalling 50. You ranked these against each other, so a high score means it beat the other three for you, not that you scored high in general.</div>
    </div>`}
    <button class="primary no-print" id="againBtn">${forcedResult ? 'Take the quiz' : 'Take it again'}</button>
  `;
  /* Download. A published page runs inside a sandboxed iframe, where a
     bare window.print() is blocked and fails silently, and so is a
     script-driven download. That's why this button did nothing. Three
     routes, first one that works wins, and which one that is depends on
     where the page is running.
       1. Inside a claude.ai artifact: the host's own save, which is the
          only route the sandbox permits. Saves the report as HTML.
       2. Served from your own domain: open the report in its own tab and
          print, so the browser's Save as PDF gives a real PDF.
       3. Plain print, if popups are blocked. */
  document.getElementById('downloadPdfBtn').onclick = async (ev) => {
    const btn = ev.currentTarget;
    const flash = (msg) => {
      const was = btn.textContent;
      btn.textContent = msg;
      setTimeout(() => { btn.textContent = was; }, 2600);
    };

    // Snapshot the report as a self-contained document.
    const clone = app.cloneNode(true);
    clone.querySelectorAll('.no-print').forEach(n => n.remove());
    const css = Array.from(document.querySelectorAll('style'))
      .map(s => s.textContent).join('\n');
    const safeName = (userName || 'Report').replace(/[^\w -]/g, '').trim() || 'Report';
    const docHtml = '<!doctype html><html><head><meta charset="utf-8">'
      + '<meta name="viewport" content="width=device-width, initial-scale=1">'
      + '<title>The Hidden Operating System - ' + safeName + '</title>'
      + '<style>' + css + '</style>'
      + '<style>body{max-width:680px;margin:0 auto;padding:28px 20px;}</style>'
      + '</head><body>' + clone.innerHTML + '</body></html>';

    const fileName = 'Hidden-Operating-System-' + safeName.replace(/ +/g, '-') + '.html';

    /* 1. The artifact host's save. claude.use resolves late and gives
          null anywhere this isn't a published artifact, so guard it and
          fall through rather than assuming it exists. */
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const dl = await window.claude.use('downloads');
        if (dl) {
          await dl.save({ filename: fileName, data: docHtml });
          flash('Saved');
          return;
        }
      }
    } catch (err) {
      // 'declined' means they said no on purpose. Don't fight it.
      if (err && err.code === 'declined') return;
      // anything else: try the ordinary browser routes below
    }

    // 2. Its own tab, then print, which is where a real PDF comes from.
    try {
      const w = window.open('', '_blank');
      if (w && w.document) {
        w.document.open();
        w.document.write(docHtml);
        w.document.close();
        setTimeout(() => { try { w.focus(); w.print(); } catch (e) {} }, 400);
        flash('Opened in a new tab');
        return;
      }
    } catch (e) { /* popups blocked, fall through */ }

    // 3. Last resort.
    try { window.print(); } catch (e) { flash('Use your browser’s print menu'); }
  };
  document.getElementById('compareBtn').onclick = () => { stage = "compare"; render(); };

  /* Copy the deep link to this result. The async clipboard API needs a
     secure context AND permission, and a sandboxed iframe grants neither,
     so writeText rejected and the old code only ever reached its fallback.
     Three routes, first one that works wins, and the last one always
     works because the reader can select the text themselves. */
  document.getElementById('shareBtn').onclick = async (ev) => {
    const btn = ev.currentTarget;
    const link = resultLink(top, userName);
    const done = (msg) => {
      const was = btn.dataset.label || btn.textContent;
      btn.dataset.label = was;
      btn.textContent = msg;
      setTimeout(() => { btn.textContent = was; }, 2600);
    };

    const showBox = (msg) => {
      let box = document.getElementById('shareLinkBox');
      if (!box) {
        box = document.createElement('input');
        box.id = 'shareLinkBox';
        box.readOnly = true;
        box.style.cssText = 'display:block; width:100%; box-sizing:border-box; margin-top:12px; padding:9px; font-size:0.85em; font-family:inherit; border:1px solid #ccc; border-radius:6px;';
        btn.parentNode.appendChild(box);
      }
      box.value = link;
      box.focus();
      box.select();
      box.setSelectionRange(0, link.length);
      done(msg);
    };

    // 1. The modern clipboard API, where it's permitted.
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(link);
        done('Link copied');
        return;
      }
    } catch (err) { /* refused in a sandboxed frame, keep going */ }

    // 2. The old execCommand route, which sandboxes still allow.
    try {
      const ta = document.createElement('textarea');
      ta.value = link;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed; top:0; left:0; opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, link.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) { done('Link copied'); return; }
    } catch (err) { /* fall through to the visible box */ }

    // 3. Show it, selected, so they can copy it by hand.
    showBox('Copy the link below');
  };

  document.getElementById('againBtn').onclick = () => {
    scores.gold = 0; scores.blue = 0; scores.orange = 0; scores.green = 0;
    ranks = []; rowPicks = [];
    stage = "email";
    userEmail = ""; userName = "";
    resultSent = false;
    forcedResult = null;
    // Drop ?r=&n= so a reload doesn't bounce back to the linked result.
    if (window.history && window.history.replaceState) {
      window.history.replaceState({}, "", window.location.pathname);
    }
    render();

  };
}

render();
</script>
